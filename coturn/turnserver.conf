# Coturn Configuration for DropLink Self-Hosted TURN Server
# Location on VPS: /etc/turnserver.conf

# Network & Listening Ports
listening-port=3478
tls-listening-port=5349

# Uncomment and set your VPS public IPv4 address if behind NAT / Cloud Firewall
# external-ip=YOUR_VPS_PUBLIC_IPV4

# Realm and Server Name (Domain Name)
realm=turn.yourdomain.com
server-name=turn.yourdomain.com

# Enable TURN REST API Authentication (Shared Secret)
use-auth-secret
static-auth-secret=32_byte_hex_secret_here

# ICE Protocol Fingerprint
fingerprint

# Relay Port Range (High UDP Ports)
min-port=49152
max-port=65535

# TLS Certificates for TURNS (port 5349)
# Uncomment after generating Let's Encrypt SSL certificate via Certbot
# cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# Security: Block relay access to internal private network ranges (Prevents Open Relay Abuse)
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

# Log Configuration
log-file=/var/log/turnserver/turnserver.log
simple-log
no-cli
